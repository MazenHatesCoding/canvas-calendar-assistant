name: Canvas Calendar Assistant

on:
  schedule:
    - cron: "7 * * * *" # every hour, at minute 7 (GitHub may start it a few minutes late)
  workflow_dispatch: # adds a "Run workflow" button for running it by hand

# Never let two runs overlap: they would both process the same items.
concurrency:
  group: assistant
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m assistant
        env:
          CANVAS_BASE_URL: ${{ secrets.CANVAS_BASE_URL }}
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          CANVAS_TOKEN_CREATED: ${{ secrets.CANVAS_TOKEN_CREATED }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ secrets.GEMINI_MODELS }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TIMETABLE: ${{ secrets.TIMETABLE }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          LOOKBACK_DAYS: ${{ secrets.LOOKBACK_DAYS }}
          DIGEST_HOUR: ${{ secrets.DIGEST_HOUR }}
